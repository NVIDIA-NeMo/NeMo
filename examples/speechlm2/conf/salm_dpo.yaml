# Generic finite direct-Lhotse SpeechLM2 DPO configuration schema.
#
# This file is intentionally not an experiment recipe. Every model, data,
# topology, optimizer, and trajectory value must be supplied by the owning
# experiment repository. See examples/speechlm2/README_dpo.md.

trainer:
  devices: ???
  num_nodes: ???
  precision: ???
  max_steps: ???
