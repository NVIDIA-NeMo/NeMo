# Runtime args (overridden via CLI)
# audio_file: "/path/to/your/audio_or_directory"
audio_file: ???
output_dir: ./generated

# Input audio padding (set at most one; null = disabled)
pad_audio_to_sec: null       # Pad each audio to this fixed duration (seconds)
pad_silence_ratio: null      # Append silence = ratio * original duration (e.g. 0.2 = 20%)
pad_audio_by_sec: null       # Append this fixed number of extra seconds of silence

pipeline_type: s2s_streaming

# S2S model block
s2s:
  model_path: ???
  llm_checkpoint_path: ???
  speaker_reference: ???
  engine_type: ??? # Engine type: 'native' or 'vllm_llm' or 'vllm_eartts' or 'vllm_llm_vllm_eartts'
  vllm_llm_config:
    model_path: ${s2s.model_path}             # Inherits from s2s.model_path
    max_model_len: 12288                      # Maximum sequence length for vLLM
    gpu_memory_utilization: 0.52               # GPU memory utilization (0.0-1.0)
    dtype: bfloat16                           # Data type for vLLM inference
    engine_path: null                         # Path to vLLM engine (null = auto-convert if needed)
    pretrained_llm: ${s2s.llm_checkpoint_path}  # Inherits from s2s.llm_checkpoint_path
    device_id: 1                              # LLM on GPU 1 (large model: ~19 GiB)

  vllm_tts_config:
    model_path: ${s2s.vllm_llm_config.model_path}             # Inherits from s2s.model_path
    max_model_len: ${s2s.vllm_llm_config.max_model_len}
    gpu_memory_utilization: 0.23                               # EarTTS GPU memory
    dtype: float32                              # EarTTS requires float32 for proper audio quality (bfloat16 causes hallucinations)
    engine_path: null
    pretrained_llm: null
    skip_tokenizer_init: true
    device_id: 0                              # EarTTS on GPU 0 (small model: ~3 GiB)

  device: cuda 
  # ========================
  # Device Configuration
  # ========================
  device_id: 0                                # GPU device ID
  compute_dtype: bfloat16                     # Compute precision: 'bfloat16' for Ampere+, 
                                              #                    'float16' for older GPUs 
                                              #                    'float32'
  # ========================
  # Inference settings
  # ========================
  codec_token_history_size: 60                # Sliding-window buffer size; ignored when use_codec_cache is true
  use_perception_cache: true                  # Enable cache-aware streaming for perception encoder
  use_perception_cudagraph: true              # Enable CUDA graph-accelerated perception encoder
  pad_and_drop_preencoded: false              # When true, first chunk uses subsequent-chunk sizes (zero-padded)
  use_codec_cache: true                       # Incremental codec decode to remove clicking sounds and wasted computation
                                              # (when true, codec_token_history_size is unused)

  # Deterministic inference (native engine only). Ensures identical results across
  # runs by disabling FlashAttention and forcing deterministic CUDA algorithms.
  # Trade-offs: slower inference, might be worse results than non-deterministic mode, since
  # non-deterministic mode was used in training.
  deterministic: false

  # sampling parameters. greedy decoding: temperature=0 (argmax), top_p=1.0, repetition_penalty=1.0.
  top_p: 1.0
  repetition_penalty: 1.0
  temperature: 0.0
  force_turn_taking: true
  force_turn_taking_threshold: 40
  force_turn_taking_pad_window: 25
  turn_taking_source: rnnt              # "rnnt" (default) or "asr_head"
  rnnt_eou_frames: 15                   # RNNT silence frames for EOU (15 × 80ms = 1.2s); overridden by S2S_RNNT_EOU_FRAMES
  rnnt_bou_frames: 3                    # RNNT speech frames for BOU / barge-in (3 × 80ms = 240ms); overridden by S2S_RNNT_BOU_FRAMES
  force_turn_taking_pad_window_first_turn: 10  # PAD-window for forced BOS on the very first user turn; overridden by S2S_FORCE_TURN_TAKING_PAD_WINDOW_FIRST_TURN
  asr_eou_first_turn: 15               # EOU silence threshold for first user turn (same as rnnt_eou_frames by default)
  asr_min_speech_frames_first_turn: 2  # Min speech frames before EOU is armed on first turn (shorter than subsequent turns)

  # RNNT punctuation logit biasing (display only — does not affect turn-taking)
  # After the user says words and pauses, blank frames incrementally boost punct
  # token logits inside the label loop so the model outputs natural sentence endings.
  rnnt_punct_bias_enabled: true
  rnnt_punct_bias_tokens: [".", ",", "?", "!"]
  rnnt_punct_bias_increment: 1.5        # logit added per blank frame after words; reset on punct or new word
  rnnt_punct_bias_min_blanks: 5         # min consecutive blank frames before bias starts (5 × 80ms = 400ms)

  # Inference logit boosts (applied to model logits at inference time)
  inference_user_pad_boost: 0.8         # Boost ASR pad logit
  inference_user_bos_boost: null         # Boost ASR BOS logit
  inference_user_eos_boost: null         # Boost ASR EOS logit
  inference_bos_boost: 0.0              # Suppress agent BOS (model's own start-of-turn). Default 0.0 = disabled. Override via S2S_INFERENCE_BOS_BOOST env var. Negative = suppress.

  system_prompt: ???
  augment_fc_system_prompt: true      # Auto-wrap tools-only FC system prompts with TOOLCALL instructions
  fc_system_prompt_template: null      # Custom FC template (null = use built-in default)
  tts_system_prompt: null              # TTS system prompt - conditions TTS generation style
                                       # Requires a checkpoint trained with individual TTS prompts

  # FC async mode: run text tokens at full LLM speed during tool calls
  fc_async_enabled: false
  # Two-phase: Phase 1 generates call tokens, pauses at EOTC for tool execution,
  # then Phase 2 injects response tokens. Requires fc_async_enabled.
  fc_async_two_phase: false
  # Enable built-in tool executor (e.g. calculate_bmi) for two-phase FC.
  # When false, Phase 2 skips tool execution (pre-provided tool_response_text still works).
  enable_builtin_tools: false
  # Random ACK phrase played at start of tool call (e.g. "Sure, give me just a moment.")
  fc_random_ack_enabled: false
  # Reminder phrase played between Phase 1 EOTC and tool API return (fills silence gap for slow APIs)
  tool_reminder_enabled: false
  # Per-tool on-hold messages (JSON: {tool_name: phrase}); null = disabled
  fc_on_hold_messages_path: null
  # Generic on-hold messages list (JSON array); up to 2 played with 1s gap if API still blocked
  fc_generic_on_hold_messages_path: null
  # Final wait (seconds) after all on-hold messages before using canned timeout response
  fc_tool_timeout_sec: 15.0
  # Max continuous agent speaking duration (seconds); forces EOS + "How can I help you?" if exceeded.
  # 0 = disabled. Default 15s.
  max_agent_response_sec: 0

  # TTS hallucination prevention (Edresson's fix): force EOS after ratio × text_token_count frames.
  # Prevents TTS from hallucinating when </s> is missing or delayed after long silence.
  # 0.0 = disabled. Default 6.0 (TTS needs ~6 frames per text token on average).
  tts_text_token_ratio_cap: 8.0
  # Minimum text tokens in turn before ratio cap activates (avoids false triggers on short responses).
  tts_text_token_min: 5

  # Which ASR source to display in the UI: 'rnnt' (default) or 'asr_head'
  # 'rnnt' uses the RNNT decoder for user transcription (more accurate)
  # 'asr_head' uses the LLM's ASR head tokens (original behavior)
  ui_asr_source: rnnt

  # RNNT ASR checkpoint for user transcription (decoder+joint from a .nemo ASR checkpoint)
  pretrained_rnnt_asr: null
  # When false (default): prefer RNNT from combined checkpoint if available.
  # When true: always load RNNT from the separate .nemo file (pretrained_rnnt_asr),
  # even if the combined checkpoint has embedded RNNT weights.
  use_separate_rnnt_ckpt: false



# ========================
# Pipeline settings
# ========================
matmul_precision: medium                     # Matrix multiplication precision: highest, high, medium

streaming:
  input_sample_rate: 16000                          # Audio sample rate in Hz
  output_sample_rate: 22050                          # Audio sample rate in Hz
  batch_size: 1                               # Number of audio frames per batch
  att_context_size: [70,0]                    # Attention context size: [70,13],[70,6],[70,2],[70,0]
  chunk_size_in_secs: ???                    # Needs to be multiple of 80ms
  buffer_size_in_secs: ???                    # Audio buffer size in seconds (larger = more context, better quality)
  request_type: frame                         # Type of request: frame, only frame is supported for cache-aware streaming
  max_len: 8192
