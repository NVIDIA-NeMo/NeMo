defaults:
  - easy_magpietts_lhotse
  - _self_

name: EasyMagpie-OneShotFlow

# Optional full-model seed prepared by scripts/magpietts/create_easy_magpietts_oneshot_flow_seed.py.
# Every shape-compatible pretrained tensor is restored; only new one-shot-flow weights remain freshly initialized.
init_from_nemo_model: null

model:
  # Match 2605_EMTTS_SmallMamba_Step150k.nemo.
  decoder_type: nemotron_h
  disable_lm_text_head: true
  disable_subword_embedding: true
  use_bpe_char_tokenizer: true
  nemotron_h_config:
    num_hidden_layers: 31
    n_routed_experts: 24
    num_experts_per_tok: 4
    moe_intermediate_size: 768
    hybrid_override_pattern: "MEMEM*EMEMEM*EMEMEMEM*EMEMEMEME"
    residual_in_fp32: false

  use_text_conditioning_encoder: true
  use_speaker_encoder: true
  train_shuffle_context_embedding_prob: 0.1
  context_duration_min: 3.0
  context_duration_max: 10.0

  # The flow target and autoregressive acoustic input are the hybrid codec residual posterior mean.
  load_cached_codes_if_available: false
  # Fail fast if model.codecmodel_path points to the legacy grouped-FSQ codec.
  require_hybrid_codec: true
  local_transformer_type: normalizing_flow
  frame_stacking_factor: 1
  # Standard deviation of Gaussian noise added only to valid teacher-forced acoustic inputs during training.
  # The acoustic prediction target and validation/inference inputs remain clean.
  acoustic_embedding_noise: 0.1
  # Match the acoustic-mask reference: draw a per-sample keep fraction from a
  # scaled Beta(1, 2), then retain exactly that many randomly ranked semantic
  # history frames with a learned mask embedding for the rest. Mean keep is 50%.
  semantic_history_infill_min: 0.25
  semantic_history_infill_max: 1.0
  # A single pointwise projection predicts the acoustic embedding from the projected
  # condition with masked L1 loss. It is never called during generation.
  acoustic_aux_loss_scale: 0.1
  local_flow_hidden_dim: 1536
  local_flow_n_flows: 4
  local_flow_n_layers: 3

  training_modes:
    - text_input_mode: streaming
      streaming_phonemes_delay: 3
      streaming_speech_delay: 5

  ignore_phoneme_languages: [vi, zh, ja, ko-KR, hi]
  add_language_to_context_text: true

  optim:
    lr: 2e-4
