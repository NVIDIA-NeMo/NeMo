defaults:
  - easy_magpietts_lhotse_oneshot_flow_matching
  - _self_

name: EasyMagpie-OneShotFlowMatchingTransformer

model:
  # Match the existing EasyMagpie AR local-transformer proportions.
  local_flow_matching_estimator_type: transformer
  local_flow_matching_hidden_dim: 1536
  local_flow_matching_n_layers: 3
  local_flow_matching_transformer_n_heads: 12
  local_flow_matching_transformer_ffn_multiplier: 4.0
  local_flow_matching_dropout: 0.0
  local_flow_matching_time_embedding_dim: 1536
  local_flow_matching_inference_steps: 8
  local_flow_matching_solver: midpoint
  local_flow_matching_transformer_condition_dropout: 0.1
  local_flow_matching_train_num_noise_samples: 4

  oneshot_zero_init_acoustic_feedback_projection: false
  oneshot_quantize_acoustic_feedback: false
  require_hybrid_codec: true
  acoustic_embedding_noise: 0.625
  semantic_history_infill_min: 0.25
  semantic_history_infill_max: 1.0

  inference_max_decoder_steps_in_val: 375
  inference_temperature_in_val: 0.9
  inference_topk_in_val: 80
  inference_use_cfg_in_val: true
  inference_cfg_scale_in_val: 2.5
  inference_flow_cfg_scale_in_val: 1.3

  optim:
    lr: 5.0e-5
    sched:
      name: ExponentialLR
      gamma: 0.98
