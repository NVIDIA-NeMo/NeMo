# Single-stage EarTTS runtime. The model path passed to AsyncOmni is the
# converted ``eartts/`` directory itself.
async_chunk: false
trust_remote_code: true
enable_prefix_caching: false
enable_chunked_prefill: false
distributed_executor_backend: uni

stages:
  - stage_id: 0
    # One conditional + one unconditional request per VoiceChat stream.
    # The no-CFG path uses only one slot.
    max_num_seqs: 2
    max_num_batched_tokens: 2048
    max_model_len: 2048
    gpu_memory_utilization: 0.30
    enforce_eager: false
    # Keep the synchronous scheduler: paired streaming requests must observe
    # the same completed step before their next updates are admitted.
    async_scheduling: false
    skip_tokenizer_init: true
    dtype: float32
    devices: "0"
    compilation_config:
      cudagraph_mode: PIECEWISE
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 2048
      detokenize: false
